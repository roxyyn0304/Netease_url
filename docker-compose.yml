# Source: https://github.com/roxyyn0304/Netease_url (backend)
# Source: https://github.com/roxyyn0304/netease-vue (frontend)
services:
  netease-url:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "5001:5000"
    volumes:
      - C:\Users\roxyy\Downloads:/app/downloads
    restart: unless-stopped

  netease-vue:
    image: netease_url-netease-vue:latest
    ports:
      - "8000:80"
    volumes:
      - D:\code\netease-vue\dist:/usr/share/nginx/html
      - D:\code\netease-vue\nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - netease-url
    restart: unless-stopped
